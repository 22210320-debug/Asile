name: asile-ticket-site
region: fra

services:
  - name: web
    environment_slug: node-js
    source_dir: /
    github:
      repo: 22210320-debug/Asile
      branch: main
      deploy_on_push: true
    build_command: npm ci
    run_command: npm start
    http_port: 3000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /healthz
    envs:
      - key: NODE_ENV
        value: production
        scope: RUN_AND_BUILD_TIME
      - key: BASE_URL
        value: https://your-app-name.ondigitalocean.app
        scope: RUN_TIME
      - key: DATABASE_URL
        value: ${asile-ticket-db.DATABASE_URL}
        scope: RUN_TIME
      - key: DATABASE_SSL
        value: "true"
        scope: RUN_TIME
      - key: SESSION_SECRET
        value: change-this-to-a-long-random-secret
        scope: RUN_TIME
        type: SECRET
      - key: STRIPE_SECRET_KEY
        value: sk_test_or_sk_live_from_stripe_dashboard
        scope: RUN_TIME
        type: SECRET
      - key: STRIPE_WEBHOOK_SECRET
        value: whsec_from_stripe_webhook
        scope: RUN_TIME
        type: SECRET
      - key: ADMIN_EMAIL
        value: your_admin_email@example.com
        scope: RUN_TIME
      - key: ADMIN_PASSWORDS
        value: admin_password_1,admin_password_2
        scope: RUN_TIME
        type: SECRET
      - key: SMTP_HOST
        value: smtp.gmail.com
        scope: RUN_TIME
      - key: SMTP_PORT
        value: "587"
        scope: RUN_TIME
      - key: SMTP_SECURE
        value: "false"
        scope: RUN_TIME
      - key: SMTP_USER
        value: your_email@example.com
        scope: RUN_TIME
      - key: SMTP_PASS
        value: your_email_app_password
        scope: RUN_TIME
        type: SECRET
      - key: EMAIL_FROM
        value: ASIL'E Tickets <your_email@example.com>
        scope: RUN_TIME

databases:
  - name: asile-ticket-db
    engine: PG
    version: "16"
    production: true
    cluster_name: asile-ticket-db-cluster
    db_name: asile_tickets
    db_user: asile_tickets
