name: asile-ticket-site
region: fra

services:
  - name: web
    environment_slug: node-js
    source_dir: /
    github:
      repo: 22210320-debug/Asile
      branch: main
      deploy_on_push: true
    build_command: npm ci
    run_command: npm start
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /healthz
    envs:
      - key: NODE_ENV
        value: production
        scope: RUN_AND_BUILD_TIME
